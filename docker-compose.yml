services:
  db:
    # PostgreSQL 18 + pgvector eklentisi hazır gelen resmi imaj
    image: pgvector/pgvector:pg18
    container_name: devmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:konteyner. Yalnızca localhost'a açıyoruz, ağdan erişilemez.
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      # Named volume: konteyner silinse de veri kalır.
      # PG 18 imajında veri dizini /var/lib/postgresql altında sürüm klasörüne gider.
      - devmind_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend          # Dockerfile'dan imaj üretir
    container_name: devmind-api
    restart: unless-stopped
    environment:
      # Tarayıcıdaki frontend'in adresi: CORS izni buna verilir.
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "127.0.0.1:8000:8000"
    # Not: API henüz veritabanını kullanmıyor; kullanmaya başlayınca
    # depends_on (db healthy) ve DATABASE_URL (host adı "db") eklenecek.

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: devmind-web
    restart: unless-stopped
    ports:
      # Host'ta 3000'i başka bir uygulama tutabiliyor; bu yüzden 3001.
      - "127.0.0.1:3001:3000"
    depends_on:
      - api

volumes:
  devmind_pgdata:
